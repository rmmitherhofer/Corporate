<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de RH - Cadastro de Colaborador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .section-title {
            position: relative;
            padding-left: 1.5rem;
        }
        .section-title:before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 70%;
            width: 4px;
            background: #3273dc;
            border-radius: 4px;
        }
        .skill-tag {
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .accordion-content {
            transition: all 0.3s ease;
        }
        .is-collapsed {
            display: none;
        }
        .card-header-icon {
            transition: transform 0.3s ease;
        }
        .is-rotated {
            transform: rotate(180deg);
        }
        .dynamic-block {
            position: relative;
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            border: 1px solid #eee;
            border-radius: 6px;
        }
        .remove-block {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
        }
        .add-skill-input {
            width: 70%;
            display: inline-block;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <section class="section">
        <div class="container">
            <h1 class="title is-2 has-text-centered mb-6">Cadastro de Colaborador</h1>
            
            <form id="employeeForm">
                <!-- Dados Cadastrais -->
                <div class="card mb-5">
                    <header class="card-header">
                        <p class="card-header-title section-title">
                            <span class="icon mr-2"><i class="fas fa-user"></i></span>
                            Dados Cadastrais
                        </p>
                        <button class="card-header-icon" type="button" aria-label="toggle">
                            <span class="icon">
                                <i class="fas fa-angle-down"></i>
                            </span>
                        </button>
                    </header>
                    <div class="card-content">
                        <div class="content">
                            <div class="columns is-multiline">
                                <div class="column is-12">
                                    <div class="field">
                                        <label class="label">Nome Completo</label>
                                        <div class="control">
                                            <input class="input" type="text" placeholder="Nome completo" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Sexo</label>
                                        <div class="control">
                                            <div class="select is-fullwidth">
                                                <select required>
                                                    <option value="" selected disabled>Selecione</option>
                                                    <option value="Masculino">Masculino</option>
                                                    <option value="Feminino">Feminino</option>
                                                    <option value="Outro">Outro</option>
                                                    <option value="Prefiro não informar">Prefiro não informar</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Data de Nascimento</label>
                                        <div class="control">
                                            <input class="input" type="date" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-4">
                                    <div class="field">
                                        <label class="label">Idade</label>
                                        <div class="control">
                                            <input class="input" type="number" placeholder="Idade" min="14" max="100" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-4">
                                    <div class="field">
                                        <label class="label">Estado Civil</label>
                                        <div class="control">
                                            <div class="select is-fullwidth">
                                                <select required>
                                                    <option value="" selected disabled>Selecione</option>
                                                    <option value="Solteiro(a)">Solteiro(a)</option>
                                                    <option value="Casado(a)">Casado(a)</option>
                                                    <option value="Divorciado(a)">Divorciado(a)</option>
                                                    <option value="Viúvo(a)">Viúvo(a)</option>
                                                    <option value="Separado(a)">Separado(a)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-4">
                                    <div class="field">
                                        <label class="label">CNH</label>
                                        <div class="control">
                                            <div class="select is-fullwidth">
                                                <select required>
                                                    <option value="" selected disabled>Selecione</option>
                                                    <option value="Não possui">Não possui</option>
                                                    <option value="A">A</option>
                                                    <option value="B">B</option>
                                                    <option value="AB">AB</option>
                                                    <option value="C">C</option>
                                                    <option value="D">D</option>
                                                    <option value="E">E</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">E-mail</label>
                                        <div class="control">
                                            <input class="input" type="email" placeholder="E-mail corporativo" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-3">
                                    <div class="field">
                                        <label class="label">Telefone</label>
                                        <div class="control">
                                            <input class="input" type="tel" placeholder="(00) 0000-0000">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-3">
                                    <div class="field">
                                        <label class="label">Celular</label>
                                        <div class="control">
                                            <input class="input" type="tel" placeholder="(00) 00000-0000" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">LinkedIn</label>
                                        <div class="control">
                                            <input class="input" type="url" placeholder="URL do perfil">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">GitHub</label>
                                        <div class="control">
                                            <input class="input" type="url" placeholder="URL do perfil">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-12">
                                    <div class="field">
                                        <label class="label">Objetivo Profissional</label>
                                        <div class="control">
                                            <textarea class="textarea" placeholder="Descreva brevemente seus objetivos profissionais"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Endereço -->
                <div class="card mb-5">
                    <header class="card-header">
                        <p class="card-header-title section-title">
                            <span class="icon mr-2"><i class="fas fa-map-marker-alt"></i></span>
                            Endereço
                        </p>
                        <button class="card-header-icon" type="button" aria-label="toggle">
                            <span class="icon">
                                <i class="fas fa-angle-down"></i>
                            </span>
                        </button>
                    </header>
                    <div class="card-content">
                        <div class="content">
                            <div class="columns is-multiline">
                                <div class="column is-8">
                                    <div class="field">
                                        <label class="label">Logradouro</label>
                                        <div class="control">
                                            <input class="input" type="text" placeholder="Rua, Avenida, etc." required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-4">
                                    <div class="field">
                                        <label class="label">Número</label>
                                        <div class="control">
                                            <input class="input" type="text" placeholder="Número" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Complemento</label>
                                        <div class="control">
                                            <input class="input" type="text" placeholder="Apartamento, bloco, etc.">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Bairro</label>
                                        <div class="control">
                                            <input class="input" type="text" placeholder="Bairro" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Cidade</label>
                                        <div class="control">
                                            <input class="input" type="text" placeholder="Cidade" required>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Estado</label>
                                        <div class="control">
                                            <div class="select is-fullwidth">
                                                <select required>
                                                    <option value="" selected disabled>Selecione</option>
                                                    <option value="AC">Acre</option>
                                                    <option value="AL">Alagoas</option>
                                                    <option value="AP">Amapá</option>
                                                    <option value="AM">Amazonas</option>
                                                    <option value="BA">Bahia</option>
                                                    <option value="CE">Ceará</option>
                                                    <option value="DF">Distrito Federal</option>
                                                    <option value="ES">Espírito Santo</option>
                                                    <option value="GO">Goiás</option>
                                                    <option value="MA">Maranhão</option>
                                                    <option value="MT">Mato Grosso</option>
                                                    <option value="MS">Mato Grosso do Sul</option>
                                                    <option value="MG">Minas Gerais</option>
                                                    <option value="PA">Pará</option>
                                                    <option value="PB">Paraíba</option>
                                                    <option value="PR">Paraná</option>
                                                    <option value="PE">Pernambuco</option>
                                                    <option value="PI">Piauí</option>
                                                    <option value="RJ">Rio de Janeiro</option>
                                                    <option value="RN">Rio Grande do Norte</option>
                                                    <option value="RS">Rio Grande do Sul</option>
                                                    <option value="RO">Rondônia</option>
                                                    <option value="RR">Roraima</option>
                                                    <option value="SC">Santa Catarina</option>
                                                    <option value="SP">São Paulo</option>
                                                    <option value="SE">Sergipe</option>
                                                    <option value="TO">Tocantins</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Formação Acadêmica -->
                <div class="card mb-5">
                    <header class="card-header">
                        <p class="card-header-title section-title">
                            <span class="icon mr-2"><i class="fas fa-graduation-cap"></i></span>
                            Formação Acadêmica
                        </p>
                        <button class="card-header-icon" type="button" aria-label="toggle">
                            <span class="icon">
                                <i class="fas fa-angle-down"></i>
                            </span>
                        </button>
                    </header>
                    <div class="card-content">
                        <div class="content">
                            <div id="academic-blocks">
                                <!-- Dynamic blocks will be added here -->
                                <div class="dynamic-block">
                                    <button class="delete remove-block" type="button"></button>
                                    
                                    <div class="columns is-multiline">
                                        <div class="column is-6">
                                            <div class="field">
                                                <label class="label">Nome da Instituição</label>
                                                <div class="control">
                                                    <input class="input" type="text" placeholder="Nome da faculdade/escola" required>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="column is-6">
                                            <div class="field">
                                                <label class="label">Nível de Formação</label>
                                                <div class="control">
                                                    <div class="select is-fullwidth">
                                                        <select required>
                                                            <option value="" selected disabled>Selecione</option>
                                                            <option value="Ensino Fundamental">Ensino Fundamental</option>
                                                            <option value="Ensino Médio">Ensino Médio</option>
                                                            <option value="Técnico">Técnico</option>
                                                            <option value="Graduação">Graduação</option>
                                                            <option value="Pós-Graduação">Pós-Graduação</option>
                                                            <option value="Mestrado">Mestrado</option>
                                                            <option value="Doutorado">Doutorado</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="column is-12">
                                            <div class="field">
                                                <label class="label">Descrição do Curso</label>
                                                <div class="control">
                                                    <input class="input" type="text" placeholder="Nome do curso" required>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="column is-6">
                                            <div class="field">
                                                <label class="label">Data de Início</label>
                                                <div class="control">
                                                    <input class="input" type="date" required>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="column is-6">
                                            <div class="field">
                                                <label class="label">Data de Conclusão</label>
                                                <div class="control">
                                                    <input class="input" type="date">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="field is-grouped is-grouped-centered mt-4">
                                <div class="control">
                                    <button type="button" class="button is-primary" id="add-academic-block">
                                        <span class="icon"><i class="fas fa-plus"></i></span>
                                        <span>Adicionar Formação</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Experiência Profissional -->
                <div class="card mb-5">
                    <header class="card-header">
                        <p class="card-header-title section-title">
                            <span class="icon mr-2"><i class="fas fa-briefcase"></i></span>
                            Experiência Profissional
                        </p>
                        <button class="card-header-icon" type="button" aria-label="toggle">
                            <span class="icon">
                                <i class="fas fa-angle-down"></i>
                            </span>
                        </button>
                    </header>
                    <div class="card-content">
                        <div class="content">
                            <div id="experience-blocks">
                                <!-- Dynamic blocks will be added here -->
                                <div class="dynamic-block">
                                    <button class="delete remove-block" type="button"></button>
                                    
                                    <div class="columns is-multiline">
                                        <div class="column is-6">
                                            <div class="field">
                                                <label class="label">Empresa</label>
                                                <div class="control">
                                                    <input class="input" type="text" placeholder="Nome da empresa" required>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="column is-6">
                                            <div class="field">
                                                <label class="label">Cargo</label>
                                                <div class="control">
                                                    <input class="input" type="text" placeholder="Cargo ocupado" required>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="column is-6">
                                            <div class="field">
                                                <label class="label">Data de Início</label>
                                                <div class="control">
                                                    <input class="input" type="date" required>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="column is-6">
                                            <div class="field">
                                                <label class="label">Data de Saída</label>
                                                <div class="control">
                                                    <input class="input" type="date">
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="column is-12">
                                            <div class="field">
                                                <label class="label">Descrição das Atividades</label>
                                                <div class="control">
                                                    <textarea class="textarea" placeholder="Descreva suas principais atividades e conquistas"></textarea>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="field is-grouped is-grouped-centered mt-4">
                                <div class="control">
                                    <button type="button" class="button is-primary" id="add-experience-block">
                                        <span class="icon"><i class="fas fa-plus"></i></span>
                                        <span>Adicionar Experiência</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Idiomas -->
                <div class="card mb-5">
                    <header class="card-header">
                        <p class="card-header-title section-title">
                            <span class="icon mr-2"><i class="fas fa-language"></i></span>
                            Idiomas
                        </p>
                        <button class="card-header-icon" type="button" aria-label="toggle">
                            <span class="icon">
                                <i class="fas fa-angle-down"></i>
                            </span>
                        </button>
                    </header>
                    <div class="card-content">
                        <div class="content">
                            <div id="language-blocks">
                                <!-- Dynamic blocks will be added here -->
                                <div class="dynamic-block">
                                    <button class="delete remove-block" type="button"></button>
                                    
                                    <div class="columns is-multiline">
                                        <div class="column is-6">
                                            <div class="field">
                                                <label class="label">Idioma</label>
                                                <div class="control">
                                                    <div class="select is-fullwidth">
                                                        <select required>
                                                            <option value="" selected disabled>Selecione</option>
                                                            <option value="Inglês">Inglês</option>
                                                            <option value="Espanhol">Espanhol</option>
                                                            <option value="Francês">Francês</option>
                                                            <option value="Alemão">Alemão</option>
                                                            <option value="Italiano">Italiano</option>
                                                            <option value="Japonês">Japonês</option>
                                                            <option value="Mandarim">Mandarim</option>
                                                            <option value="Português">Português</option>
                                                            <option value="Outro">Outro</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="column is-6">
                                            <div class="field">
                                                <label class="label">Nível de Proficiência</label>
                                                <div class="control">
                                                    <div class="select is-fullwidth">
                                                        <select required>
                                                            <option value="" selected disabled>Selecione</option>
                                                            <option value="Básico">Básico</option>
                                                            <option value="Intermediário">Intermediário</option>
                                                            <option value="Avançado">Avançado</option>
                                                            <option value="Fluente">Fluente</option>
                                                            <option value="Nativo">Nativo</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="field is-grouped is-grouped-centered mt-4">
                                <div class="control">
                                    <button type="button" class="button is-primary" id="add-language-block">
                                        <span class="icon"><i class="fas fa-plus"></i></span>
                                        <span>Adicionar Idioma</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Habilidades -->
                <div class="card mb-5">
                    <header class="card-header">
                        <p class="card-header-title section-title">
                            <span class="icon mr-2"><i class="fas fa-lightbulb"></i></span>
                            Habilidades
                        </p>
                        <button class="card-header-icon" type="button" aria-label="toggle">
                            <span class="icon">
                                <i class="fas fa-angle-down"></i>
                            </span>
                        </button>
                    </header>
                    <div class="card-content">
                        <div class="content">
                            <div class="columns">
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Soft Skills</label>
                                        <div class="control">
                                            <div id="soft-skills-container" class="tags">
                                                <!-- Skills will be added here -->
                                            </div>
                                            <div class="field has-addons mt-2">
                                                <div class="control is-expanded">
                                                    <input class="input add-skill-input" type="text" placeholder="Adicionar soft skill" id="soft-skill-input">
                                                </div>
                                                <div class="control">
                                                    <button type="button" class="button is-primary" id="add-soft-skill">
                                                        <span class="icon"><i class="fas fa-plus"></i></span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="column is-6">
                                    <div class="field">
                                        <label class="label">Hard Skills</label>
                                        <div class="control">
                                            <div id="hard-skills-container" class="tags">
                                                <!-- Skills will be added here -->
                                            </div>
                                            <div class="field has-addons mt-2">
                                                <div class="control is-expanded">
                                                    <input class="input add-skill-input" type="text" placeholder="Adicionar hard skill" id="hard-skill-input">
                                                </div>
                                                <div class="control">
                                                    <button type="button" class="button is-primary" id="add-hard-skill">
                                                        <span class="icon"><i class="fas fa-plus"></i></span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Form Actions -->
                <div class="field is-grouped is-grouped-centered">
                    <div class="control">
                        <button type="submit" class="button is-primary is-large">
                            <span class="icon"><i class="fas fa-save"></i></span>
                            <span>Salvar Cadastro</span>
                        </button>
                    </div>
                    <div class="control">
                        <button type="reset" class="button is-light is-large">
                            <span class="icon"><i class="fas fa-eraser"></i></span>
                            <span>Limpar Formulário</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Accordion functionality
            const accordionHeaders = document.querySelectorAll('.card-header');
            
            accordionHeaders.forEach(header => {
                header.addEventListener('click', () => {
                    const card = header.parentElement;
                    const content = card.querySelector('.card-content');
                    const icon = header.querySelector('.card-header-icon i');
                    
                    if (content.style.display === 'none') {
                        content.style.display = 'block';
                        icon.classList.remove('fa-angle-up');
                        icon.classList.add('fa-angle-down');
                    } else {
                        content.style.display = 'none';
                        icon.classList.remove('fa-angle-down');
                        icon.classList.add('fa-angle-up');
                    }
                });
            });
            
            // Add academic block
            const addAcademicBlockBtn = document.getElementById('add-academic-block');
            const academicBlocksContainer = document.getElementById('academic-blocks');
            
            addAcademicBlockBtn.addEventListener('click', () => {
                const newBlock = document.createElement('div');
                newBlock.className = 'dynamic-block';
                newBlock.innerHTML = `
                    <button class="delete remove-block" type="button"></button>
                    
                    <div class="columns is-multiline">
                        <div class="column is-6">
                            <div class="field">
                                <label class="label">Nome da Instituição</label>
                                <div class="control">
                                    <input class="input" type="text" placeholder="Nome da faculdade/escola" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="column is-6">
                            <div class="field">
                                <label class="label">Nível de Formação</label>
                                <div class="control">
                                    <div class="select is-fullwidth">
                                        <select required>
                                            <option value="" selected disabled>Selecione</option>
